<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masraweya CMS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="cms-defaults.js"></script><style>
:root{--navy:#102a43;--blue:#1d6f9f;--mint:#eaf5f7;--line:#dfe7ec;--text:#1d2935;--muted:#6b7785;--bg:#f6f8fa;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #102a4312}.login-card{width:min(430px,100%);padding:30px}.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:16px 0 7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);outline:none}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1d6f9f12}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#eef4f7;color:var(--navy)}.danger{background:#fff0f0;color:#a33}.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#fff;padding:22px 14px;overflow:auto}.brand{font-size:20px;font-weight:900;padding:10px 12px 22px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dbe8f0;padding:12px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff15;color:#fff}.main{margin-left:250px;padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{margin:0}.status{font-size:13px;color:var(--muted)}.section{display:none}.section.active{display:block}.section-head{margin-bottom:18px}.section-head h2{margin:0 0 5px}.section-head p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:18px}.card h3{margin:0 0 14px}.field{margin-bottom:16px}.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;color:var(--muted);margin-top:5px}.image-card{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:start}.preview{width:170px;height:120px;border-radius:12px;overflow:hidden;background:#eef3f6;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px}.preview img{width:100%;height:100%;object-fit:cover}.image-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.savebar{position:sticky;bottom:14px;margin-top:20px;background:#ffffffee;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #102a4312}.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.statbox{padding:18px}.statbox b{font-size:28px;display:block}.statbox span{color:var(--muted);font-size:13px}@media(max-width:900px){.sidebar{position:static;width:100%;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.main{margin-left:0;padding:18px}.grid,.lang-grid,.image-card{grid-template-columns:1fr}.preview{width:100%;height:180px}.dash{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><h1>Masraweya CMS</h1><p>Sign in to manage the live website content and images.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:18px" id="loginBtn">Sign in</button><p id="loginMsg"></p></div></div>
<div id="app" class="app"><aside class="sidebar"><div class="brand">MASRAWEYA<br><small>CONTENT MANAGER</small></div><nav class="nav" id="nav"></nav><button class="btn secondary" style="width:100%;margin-top:15px" id="logoutBtn">Sign out</button></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="status" id="status">Ready</div></div><a class="btn secondary" href="index.html" target="_blank">Open Website ↗</a></div><div id="sections"></div></main></div><div id="toast" class="toast"></div>
<script>
const C=window.MASRAWEYA_SUPABASE;const client=window.supabase.createClient(C.url,C.anonKey);let content=JSON.parse(JSON.stringify(window.MASRAWEYA_DEFAULT_CONTENT));
const sections=[
{id:'dashboard',label:'Dashboard',icon:'⌂'},
{id:'home',label:'Home',icon:'⌂',fields:[['hero','Hero'],['about','About section'],['journey','Academics preview'],['life','School Life'],['results','Student Results'],['news','Latest News'],['contact','Home contact']]},
{id:'about',label:'About',icon:'01'}, {id:'academics',label:'Academics',icon:'02'}, {id:'activities',label:'School Life',icon:'03'}, {id:'admissions',label:'Admissions',icon:'04'}, {id:'gallery',label:'Gallery',icon:'05'}, {id:'news',label:'News',icon:'06'}, {id:'results',label:'Student Results',icon:'07'}, {id:'contact',label:'Contact',icon:'08'}, {id:'site',label:'General',icon:'⚙'}];
const defs={
site:{title:'General',intro:'School identity, contact details and global settings.',groups:[{title:'School identity',fields:[['site.name','School name'],['site.sub','School subtitle'],['site.tagline','Tagline'],['site.logo','Logo','image']]},{title:'Contact & links',fields:[['site.phone','Phone'],['site.whatsapp','WhatsApp'],['site.email','Email'],['site.address','Address'],['site.facebook','Facebook URL'],['site.instagram','Instagram URL'],['site.maps','Google Maps URL'],['site.resultsUrl','Student Results URL']]}]},
home:{title:'Home',intro:'Everything editable on the homepage. Images belong to the same section as their text.',groups:[{title:'Hero',fields:[['home.eyebrow','Eyebrow'],['home.title','Main title'],['home.desc','Description'],['home.heroImage','Hero image','image']]},{title:'About section',fields:[['home.aboutTitle','Title'],['home.aboutText1','Paragraph 1'],['home.aboutText2','Paragraph 2'],['home.aboutImage','Main image','image'],['home.aboutExperienceImage','Experience image','image']]},{title:'Academics preview',fields:[['home.journeyTitle','Title'],['home.journeyText','Description'],['home.journey.kgTitle','KG title'],['home.journey.kgText','KG text'],['home.journey.primaryTitle','Primary title'],['home.journey.primaryText','Primary text'],['home.journey.prepTitle','Preparatory title'],['home.journey.prepText','Preparatory text'],['home.academicsImage','Section image','image']]},{title:'School Life',fields:[['home.lifeTitle','Title'],['home.lifeText','Description'],['home.lifeImage','Main image','image'],['home.lifeCards.classroom','Classroom image','image'],['home.lifeCards.creativity','Creativity image','image'],['home.lifeCards.science','Science image','image'],['home.lifeCards.teamwork','Teamwork image','image'],['home.lifeCards.classroomTitle','Classroom title'],['home.lifeCards.classroomText','Classroom text'],['home.lifeCards.creativityTitle','Creativity title'],['home.lifeCards.creativityText','Creativity text'],['home.lifeCards.scienceTitle','Science title'],['home.lifeCards.scienceText','Science text'],['home.lifeCards.teamworkTitle','Teamwork title'],['home.lifeCards.teamworkText','Teamwork text']]},{title:'Student Results',fields:[['home.resultsTitle','Title'],['home.resultsText','Description'],['home.resultsCardTitle','Card title'],['home.resultsCardText','Card text'],['home.resultsImage','Image','image']]},{title:'Latest News',fields:[['home.newsText','Description'],['home.newsCard1Title','Card 1 title'],['home.newsCard1Text','Card 1 text'],['home.newsCard2Title','Card 2 title'],['home.newsCard2Text','Card 2 text'],['home.newsCard3Title','Card 3 title'],['home.newsCard3Text','Card 3 text'],['home.newsImage','Section image','image'],['home.newsFeatureImage','Card 1 image','image'],['home.newsCard2Image','Card 2 image','image'],['home.newsCard3Image','Card 3 image','image']]},{title:'Contact preview',fields:[['home.contactTitle','Title'],['home.contactText','Description']]}]},
about:{title:'About',intro:'All editable content for the About page.',groups:[{title:'Hero',fields:[['about.title','Title'],['about.text','Intro'],['about.image','Main image','image']]},{title:'Story',fields:[['about.sectionTitle','Section title'],['about.sectionText','Section text'],['about.text2','Paragraph 2'],['about.text3','Paragraph 3'],['about.campusImage','Campus image','image']]}]},
academics:{title:'Academics',intro:'All editable content for the Academics page.',groups:[{title:'Page',fields:[['academics.title','Title'],['academics.text','Intro'],['academics.image','Main image','image']]},{title:'Stages',fields:[['academics.kgTitle','KG title'],['academics.kgText','KG text'],['academics.primaryTitle','Primary title'],['academics.primaryText','Primary text'],['academics.prepTitle','Preparatory title'],['academics.prepText','Preparatory text']]}]},
activities:{title:'School Life',intro:'All text and images for School Life.',groups:[{title:'Page',fields:[['activities.title','Title'],['activities.text','Intro'],['activities.image','Main image','image']]},{title:'Cards',fields:[['activities.cards.classroom','Classroom image','image'],['activities.cards.classroomTitle','Classroom title'],['activities.cards.classroomText','Classroom text'],['activities.cards.creativity','Creativity image','image'],['activities.cards.creativityTitle','Creativity title'],['activities.cards.creativityText','Creativity text'],['activities.cards.science','Science image','image'],['activities.cards.scienceTitle','Science title'],['activities.cards.scienceText','Science text'],['activities.cards.teamwork','Teamwork image','image'],['activities.cards.teamworkTitle','Teamwork title'],['activities.cards.teamworkText','Teamwork text']]}]},
admissions:{title:'Admissions',intro:'All editable content for Admissions.',groups:[{title:'Page',fields:[['admissions.title','Title'],['admissions.text','Intro'],['admissions.image','Main image','image']]},{title:'Information',fields:[['admissions.askTitle','Ask title'],['admissions.askText','Ask text'],['admissions.visitTitle','Visit title'],['admissions.visitText','Visit text']]}]},
gallery:{title:'Gallery',intro:'Manage gallery title and every gallery image.',groups:[{title:'Page',fields:[['gallery.title','Title'],['gallery.text','Intro']]},{title:'Gallery images',fields:Array.from({length:9},(_,i)=>[`gallery.images.${['one','two','three','four','five','six','seven','eight','nine'][i]}`,`Gallery image ${i+1}`,'image'])}]},
news:{title:'News',intro:'Manage the News page text and all card images.',groups:[{title:'Page',fields:[['news.title','Title'],['news.text','Intro'],['news.image','Main image','image']]},{title:'Cards',fields:[['news.featureImage','Card 1 image','image'],['news.card1Title','Card 1 title'],['news.card1Text','Card 1 text'],['news.card2Image','Card 2 image','image'],['news.card2Title','Card 2 title'],['news.card2Text','Card 2 text'],['news.card3Image','Card 3 image','image'],['news.card3Title','Card 3 title'],['news.card3Text','Card 3 text']]}]},
results:{title:'Student Results',intro:'Control the results page and the official results destination.',groups:[{title:'Page',fields:[['results.title','Title'],['results.text','Intro'],['results.image','Main image','image'],['results.sectionTitle','Section title'],['results.sectionText','Section text']]},{title:'Global destination',fields:[['site.resultsUrl','Results URL']]}]},
contact:{title:'Contact',intro:'Manage contact page copy, image and social details.',groups:[{title:'Page',fields:[['contact.title','Title'],['contact.text','Intro'],['contact.image','Main image','image'],['contact.socialTitle','Social title'],['contact.socialText','Social text']]},{title:'Contact details',fields:[['site.phone','Phone'],['site.whatsapp','WhatsApp'],['site.email','Email'],['site.address','Address']]}]}
};
function get(o,path){return path.split('.').reduce((x,k)=>x==null?undefined:x[k],o)}function set(o,path,val){let a=path.split('.'),x=o;for(let i=0;i<a.length-1;i++){if(!x[a[i]]||typeof x[a[i]]!=='object')x[a[i]]={};x=x[a[i]]}x[a[a.length-1]]=val}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function bilingual(path,v){return v&&typeof v==='object'&&!Array.isArray(v)&&('en' in v||'ar' in v)}
function fieldHTML(path,label,type){let v=get(content,path); if(type==='image'){return `<div class="card image-card"><div class="preview" id="preview-${path.replaceAll('.','-')}">${v?`<img src="${esc(v)}" onerror="this.parentElement.innerHTML='Image unavailable'">`:'No image'}</div><div><h3>${label}</h3><input type="text" data-path="${path}" value="${esc(v||'')}" placeholder="Image URL (Supabase or public URL)"><div class="hint">Upload a file below. The saved URL is written to this exact CMS field.</div><div class="image-actions"><input type="file" accept="image/*" data-upload="${path}" style="max-width:250px"><button class="btn secondary" data-upload-btn="${path}">Upload & Save</button></div></div></div>`}
 if(bilingual(path,v)){return `<div class="card"><h3>${label}</h3><div class="lang-grid"><div><label>English</label><textarea data-path="${path}.en">${esc(v.en||'')}</textarea></div><div><label>Arabic</label><textarea dir="rtl" data-path="${path}.ar">${esc(v.ar||'')}</textarea></div></div></div>`}
 return `<div class="card"><label>${label}</label><textarea data-path="${path}">${esc(v||'')}</textarea></div>`}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function renderSection(id){if(id==='dashboard'){document.getElementById('sections').innerHTML=`<section class="section active"><div class="section-head"><h2>Dashboard</h2><p>One CMS source controls the live website. Edit a section, save it, then refresh the website.</p></div><div class="dash"><div class="card statbox"><b>${Object.keys(defs).length}</b><span>CMS sections</span></div><div class="card statbox"><b>${document.querySelectorAll('[data-cms-image]').length}</b><span>Image bindings</span></div><div class="card statbox"><b>EN / AR</b><span>Bilingual fields</span></div><div class="card statbox"><b>LIVE</b><span>Supabase content</span></div></div><div class="card" style="margin-top:16px"><h3>Important</h3><p>Every editable website element has a matching CMS key. Do not edit the HTML for normal text or image changes.</p></div></section>`;return}let d=defs[id];let html=`<section class="section active"><div class="section-head"><h2>${d.title}</h2><p>${d.intro}</p></div>`;for(const g of d.groups){html+=`<div class="card" style="margin-bottom:16px"><h3>${g.title}</h3><div class="grid">${g.fields.map(f=>fieldHTML(f[0],f[1],f[2])).join('')}</div></div>`}html+=`<div class="savebar"><span class="status">Changes are saved to Supabase and read by the website.</span><button class="btn primary" data-save-section="${id}">Save ${d.title}</button></div></section>`;document.getElementById('sections').innerHTML=html}
function collect(){document.querySelectorAll('#sections [data-path]').forEach(e=>set(content,e.dataset.path,e.tagName==='TEXTAREA'||e.type==='text'?e.value:e.value));}
async function save(){collect();document.getElementById('status').textContent='Saving…';let {error}=await client.from('site_content').upsert({id:1,content,updated_at:new Date().toISOString()});if(error){toast(error.message);document.getElementById('status').textContent='Save failed';return}document.getElementById('status').textContent='Saved '+new Date().toLocaleTimeString();toast('Saved. The website will use the new content on refresh.')}
async function upload(path){let input=document.querySelector(`[data-upload="${CSS.escape(path)}"]`),f=input?.files?.[0];if(!f)return toast('Choose an image first.');let safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'-'),filePath=`cms/${Date.now()}-${safe}`;document.getElementById('status').textContent='Uploading…';let up=await client.storage.from('site-images').upload(filePath,f,{upsert:false,contentType:f.type});if(up.error)return toast(up.error.message);let {data}=client.storage.from('site-images').getPublicUrl(filePath);set(content,path,data.publicUrl);let {error}=await client.from('site_content').upsert({id:1,content,updated_at:new Date().toISOString()});if(error)return toast(error.message);renderSection(active);toast('Image uploaded and saved.');document.getElementById('status').textContent='Image saved'}
let active='dashboard';function open(id){active=id;document.getElementById('pageTitle').textContent=id==='dashboard'?'Dashboard':defs[id]?.title||id;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));renderSection(id)}
function buildNav(){document.getElementById('nav').innerHTML=sections.map(s=>`<button data-id="${s.id}">${s.icon} &nbsp; ${s.label}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>open(b.dataset.id))}
async function load(){let {data,error}=await client.from('site_content').select('content').eq('id',1).single();if(!error&&data?.content){content=merge(JSON.parse(JSON.stringify(window.MASRAWEYA_DEFAULT_CONTENT)),data.content)}buildNav();open('dashboard')}
function merge(a,b){if(!b||typeof b!=='object')return a;Object.keys(b).forEach(k=>{if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))a[k]=merge(a[k]||{},b[k]);else a[k]=b[k]});return a}
document.addEventListener('click',e=>{let s=e.target.closest('[data-save-section]');if(s)save();let u=e.target.closest('[data-upload-btn]');if(u)upload(u.dataset.uploadBtn)});
async function start(){let {data}=await client.auth.getSession();if(data.session){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';await load()}}
document.getElementById('loginBtn').onclick=async()=>{let email=document.getElementById('email').value,password=document.getElementById('password').value;let {error}=await client.auth.signInWithPassword({email,password});document.getElementById('loginMsg').textContent=error?error.message:'Signed in…';if(!error)start()};document.getElementById('logoutBtn').onclick=async()=>{await client.auth.signOut();location.reload()};start();
</script></body></html>
